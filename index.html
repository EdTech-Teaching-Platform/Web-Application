<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Learning | Online test series and learning</title>
    <meta name="description" content="Universal Learning: practise with expert-built online test series, timed mock exams and detailed performance reports for school and competitive exams." />
    <meta name="theme-color" content="#1f3a8a" />
    <!-- Link previews (WhatsApp, LinkedIn, X). Absolute URLs: update the domain
         here when the custom domain goes live (QA audit WEB-02 / WEB-05). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Universal Learning" />
    <meta property="og:title" content="Universal Learning | Online test series and learning" />
    <meta property="og:description" content="Practise with expert-built online test series, timed mock exams and detailed performance reports." />
    <meta property="og:url" content="https://web-application-roan-eight.vercel.app/" />
    <meta property="og:image" content="https://web-application-roan-eight.vercel.app/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Universal Learning logo" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Universal Learning | Online test series and learning" />
    <meta name="twitter:description" content="Practise with expert-built online test series, timed mock exams and detailed performance reports." />
    <meta name="twitter:image" content="https://web-application-roan-eight.vercel.app/icon-512.png" />
    <!-- Admin Console (Universal Learning) typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet" />
    <!-- First paint while the app's JavaScript loads (QA audit WEB-01 / BUG-01).
         React replaces everything inside #root when it starts. -->
    <style>
      .ul-boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #f3f6fd; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1d2433; }
      .ul-boot__mark { width: 56px; height: 56px; border-radius: 50%; border: 4px solid #dfe6f7; border-top-color: #2f55d4; animation: ul-boot-spin 0.9s linear infinite; }
      .ul-boot__name { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
      .ul-boot__msg { max-width: 420px; padding: 0 16px; font-size: 14px; line-height: 1.5; text-align: center; color: #475467; }
      @keyframes ul-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .ul-boot__mark { animation: none; } }
    </style>
  </head>
  <body>
    <!-- Between the app-html markers: the loader, or on public pages the
         server-rendered content (api/page.js, QA audit WEB-03). -->
    <div id="root"><!--app-html-->
      <div class="ul-boot" role="status" aria-live="polite">
        <div class="ul-boot__mark" aria-hidden="true"></div>
        <p class="ul-boot__name">Universal Learning</p>
        <span class="ul-boot__msg">Loading…</span>
      </div>
    <!--/app-html--></div>
    <noscript>
      <div class="ul-boot">
        <p class="ul-boot__name">Universal Learning</p>
        <p class="ul-boot__msg">This site needs JavaScript. Please enable JavaScript in your browser settings and reload the page.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
